version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: healthcare_docs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend/api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/healthcare_docs
      JWT_SECRET: dev-secret-change-in-production
      DOCUMENT_STORAGE_DIR: /app/storage/documents
      ML_SERVICE_URL: http://ml-service:8000
    depends_on:
      - postgres
    volumes:
      - backend_storage:/app/storage

  ml-service:
    build: ./backend/ml/service
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"

volumes:
  pgdata:
  backend_storage:
